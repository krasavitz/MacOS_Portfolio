<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Phones ignore SVG favicons: iOS uses this for tabs, bookmarks and the
         home screen, Android the manifest's icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover lets the mobile shell run edge to edge; its CSS
         pads for the notch and home bar with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Oliver Naumov" />

    <!-- seo:start — the home page's tags. At build time scripts/prerender.mjs
         replaces everything up to seo:end with each page's own tags (from
         src/seo.js) and adds structured data. Edit copy in src/seo.js. -->
    <title>Oliver Naumov, Product Designer and Founder</title>
    <meta name="description" content="Oliver Naumov is a product designer and founder in New York. Co-founder of Tchpack, an AI platform for fashion brands. Apps, websites, brand and growth." />
    <link rel="canonical" href="https://olivernaumov.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oliver Naumov" />
    <meta property="og:title" content="Oliver Naumov, Product Designer and Founder" />
    <meta property="og:description" content="Oliver Naumov is a product designer and founder in New York. Co-founder of Tchpack, an AI platform for fashion brands. Apps, websites, brand and growth." />
    <meta property="og:url" content="https://olivernaumov.xyz/" />
    <meta property="og:image" content="https://olivernaumov.xyz/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oliver Naumov, Product Designer and Founder" />
    <meta name="twitter:description" content="Oliver Naumov is a product designer and founder in New York. Co-founder of Tchpack, an AI platform for fashion brands. Apps, websites, brand and growth." />
    <meta name="twitter:image" content="https://olivernaumov.xyz/og.png" />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <!-- seo:links -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
