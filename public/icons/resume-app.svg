<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Resume">
  <!-- Mobile app icon for the résumé: the page itself fills the squircle — a
       pink header band with the name and title, then a two-column body, the
       way the real résumé is laid out. Sibling of simple-app.svg. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f1f1" />
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7bb0" />
      <stop offset="1" stop-color="#ff4f93" />
    </linearGradient>
    <clipPath id="squircle">
      <rect width="128" height="128" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="128" height="128" fill="url(#paper)" />
    <rect width="128" height="44" fill="url(#band)" />

    <!-- name + title -->
    <rect x="20" y="15" width="60" height="8" rx="4" fill="#ffffff" />
    <rect x="20" y="28" width="36" height="4.5" rx="2.25" fill="#ffffff" opacity="0.75" />

    <!-- main column -->
    <rect x="20" y="58" width="30" height="5" rx="2.5" fill="#1a1a1a" opacity="0.85" />
    <rect x="20" y="70" width="56" height="4" rx="2" fill="#1a1a1a" opacity="0.4" />
    <rect x="20" y="80" width="50" height="4" rx="2" fill="#1a1a1a" opacity="0.4" />
    <rect x="20" y="90" width="56" height="4" rx="2" fill="#1a1a1a" opacity="0.4" />
    <rect x="20" y="100" width="38" height="4" rx="2" fill="#1a1a1a" opacity="0.4" />

    <!-- side column -->
    <rect x="88" y="58" width="20" height="5" rx="2.5" fill="#ff5c9d" />
    <rect x="88" y="70" width="20" height="4" rx="2" fill="#1a1a1a" opacity="0.28" />
    <rect x="88" y="80" width="16" height="4" rx="2" fill="#1a1a1a" opacity="0.28" />
    <rect x="88" y="90" width="20" height="4" rx="2" fill="#1a1a1a" opacity="0.28" />
  </g>

  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none" stroke="#e2e2e2" />
</svg>
